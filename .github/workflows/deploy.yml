name: Deploy to IONOS

on:
  push:
    branches: [claude/dreamy-keller-pqtt30]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npx astro build

      - name: Install paramiko
        run: pip install paramiko

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 << 'PYEOF'
          import os, paramiko
          from pathlib import Path

          host     = os.environ['SFTP_SERVER']
          user     = os.environ['SFTP_USER']
          password = os.environ['SFTP_PASS']
          remote   = os.environ['SFTP_DIR'].rstrip('/')
          local    = Path('./dist')

          print(f"Connecting to {host}:22 ...")
          t = paramiko.Transport((host, 22))
          t.connect(username=user, password=password)
          sftp = paramiko.SFTPClient.from_transport(t)
          print("Connected!")

          def ensure_dir(path):
              try:
                  sftp.stat(path)
              except FileNotFoundError:
                  parent = os.path.dirname(path)
                  if parent and parent != path:
                      ensure_dir(parent)
                  sftp.mkdir(path)

          def upload(local_path, remote_path):
              ensure_dir(remote_path)
              for item in sorted(local_path.iterdir()):
                  r = f"{remote_path}/{item.name}"
                  if item.is_dir():
                      upload(item, r)
                  else:
                      print(f"  {item.relative_to(local)} -> {r}")
                      sftp.put(str(item), r)

          upload(local, remote)
          sftp.close()
          t.close()
          print("Deploy complete!")
          PYEOF
