name: Deploy to IONOS

on:
  push:
    branches: [claude/dreamy-keller-pqtt30]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npx astro build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';
            open -u $SFTP_USER,$SFTP_PASS sftp://$SFTP_SERVER:22;
            mirror --reverse --delete --verbose ./dist/ $SFTP_DIR;
            quit
          "
